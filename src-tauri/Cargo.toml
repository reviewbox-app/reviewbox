[package]
name = "reviewbox"
version = "0.1.0"
description = "A desktop workspace for agent-assisted code review"
edition = "2024"
rust-version = "1.95"
publish = false

# Keep useful backtraces without full type/variable debug information. Tests
# inherit this profile. Reuse dependencies, but avoid growing incremental caches.
[profile.dev]
debug = 1
incremental = false

[lib]
name = "reviewbox_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fontdb = "=0.24.0"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
flate2 = "1.1.10"
ignore = "0.4.25"
globset = "0.4.20"
toml = "0.9.12"
trash = "5.2.9"
json5 = "0.4"
notify = "8.2.0"
parking_lot = "=0.12.5"
portable-pty = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
regex = "1.13"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tar = "0.4.46"
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros", "net"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[lints.rust]
# Narrow macOS bridges (menus, termination and notification delegates)
# document their ABI and lifetime invariants alongside local exceptions.
unsafe_code = "deny"

[features]
native-validation = ["dep:tauri-plugin-wdio-webdriver"]
