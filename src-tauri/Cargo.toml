[package]
name = "reviewbox"
version = "0.1.0"
description = "A desktop workspace for agent-assisted code review"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "reviewbox_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[features]
native-validation = ["dep:tauri-plugin-wdio-webdriver"]
