name: ReviewBox checks
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run test:rust
      - run: bunx --bun playwright install chromium
      - run: bun run test:web
      - run: bun run build
